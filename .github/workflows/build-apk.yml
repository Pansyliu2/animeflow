name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 安装 Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2

      - name: 接受 Android 协议
        run: yes | flutter doctor --android-licenses || true

      - name: 编译 APK
        run: flet build apk --arch arm64-v8a --verbose

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeFlow-APK
          path: build/apk/*.apk
          if-no-files-found: error
