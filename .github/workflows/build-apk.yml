name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 环境检查
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          flutter doctor -v || true

      - name: 生成 Android 工程骨架
        run: |
          flutter create --org com.animeflow --project-name animeflow --platforms=android build_src
          cp lib/main.dart build_src/lib/main.dart
          cp pubspec.yaml build_src/pubspec.yaml
          echo "===== 骨架生成完成 ====="
          ls -la build_src
          ls -la build_src/lib

      - name: 注入网络权限和应用名
        working-directory: build_src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace("<application", permission + "\n    <application", 1)
          text = text.replace('android:label="animeflow"', 'android:label="AnimeFlow"')
          manifest.write_text(text, encoding="utf-8")
          print(manifest.read_text(encoding="utf-8"))
          PY

      - name: 拉取 Dart 依赖
        working-directory: build_src
        run: |
          flutter pub get
          echo "===== 依赖清单 ====="
          flutter pub deps --style=compact || true

      - name: 编译 APK
        working-directory: build_src
        run: flutter build apk --release --target-platform android-arm64

      - name: 检查产物
        if: always()
        run: |
          echo "===== 产物目录 ====="
          ls -la build_src/build/app/outputs/flutter-apk || echo "没有产物目录"

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeFlow-APK
          path: build_src/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
