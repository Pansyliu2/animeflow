name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # 关键：ubuntu-latest 已升级到 26.04，Flet 打包的 Python 运行时在里面跑不起来。
    # 22.04 是 Flet 官方验证过的平台，glibc 版本匹配。
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 打印环境信息
        run: |
          echo "===== 系统版本 ====="
          head -n 4 /etc/os-release
          echo "===== glibc ====="
          ldd --version | head -n 1
          echo "===== python ====="
          python --version
          echo "===== java ====="
          java -version
          echo "===== flutter ====="
          flutter --version
          echo "===== 目录 ====="
          pwd
          ls -la

      - name: 接受 Android 协议
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v || true

      - name: 检查项目文件
        run: |
          echo "===== pyproject.toml ====="
          cat pyproject.toml || echo "缺少 pyproject.toml"
          echo "===== main.py 前 5 行 ====="
          head -n 5 main.py || echo "缺少 main.py"
          echo "===== requirements.txt ====="
          cat requirements.txt || echo "缺少 requirements.txt"

      - name: 编译 APK（失败自动换版本重试）
        id: apk_build
        shell: bash
        run: |
          set -o pipefail
          OK=0
          for V in 0.25.2 0.24.3 0.23.2; do
            echo "::group::尝试 flet==$V"
            python -m pip install --upgrade pip --retries 5 --timeout 60 || true
            if ! python -m pip install --retries 5 --timeout 60 "flet==$V"; then
              echo "flet==$V 安装失败，换下一个版本"
              echo "::endgroup::"
              continue
            fi
            flet --version || true
            rm -rf build
            if flet build apk --arch arm64-v8a --verbose 2>&1 | tee "build_${V}.log"; then
              if ls build/apk/*.apk >/dev/null 2>&1; then
                OK=1
                echo "BUILT_WITH=$V" >> "$GITHUB_ENV"
                echo "::endgroup::"
                break
              fi
            fi
            echo "flet==$V 构建失败，清空 build 后重试下一版本"
            echo "::endgroup::"
          done

          if [ "$OK" != "1" ]; then
            echo "::error::三个 flet 版本全部失败，请看 build_*.log"
            exit 1
          fi
          echo "构建成功，使用 flet==$BUILT_WITH"

      - name: 列出产物
        if: always()
        run: |
          echo "===== build/apk ====="
          ls -la build/apk || echo "没有 build/apk 目录"

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeFlow-APK
          path: build/apk/*.apk
          if-no-files-found: warn

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_*.log
          if-no-files-found: ignore
